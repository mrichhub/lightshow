[platformio]
default_envs = wt32-eth01, esp32dev
extra_configs = platformio.local.ini

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
lib_deps =
	fastled/FastLED@3.9.15
	bblanchon/ArduinoJson@7.4.2
	knolleary/PubSubClient@2.8
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -D FASTLED_RMT5=0

[env:wt32-eth01]
board = wt32-eth01
build_flags = ${env.build_flags} -D LIGHTSHOW_ETHERNET=1

[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags} -D LIGHTSHOW_ETHERNET=0
