name: validate
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm install -g pnpm@10.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check && pnpm typecheck && pnpm test && pnpm test:firmware && pnpm build
      - name: Generate private deployment configuration
        run: pnpm run setup
      - name: Start integration services and export public trust
        run: docker compose up -d --build --wait && pnpm trust
      - name: Verify MongoDB allocator fallback
        run: |
          docker compose exec -T mongo bash -c '
            exec mongosh --quiet \
              --username "$MONGO_INITDB_ROOT_USERNAME" \
              --password "$MONGO_INITDB_ROOT_PASSWORD" \
              --authenticationDatabase admin \
              --eval "db.serverStatus().tcmalloc.usingPerCPUCaches === false || quit(1)"
          '
      - run: bash scripts/integration.sh
      - if: always()
        run: docker compose logs --tail 100 && docker compose down
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install platformio==6.2.0
      - run: pio run -d firmware/esp32 -e wt32-eth01 -e esp32dev
