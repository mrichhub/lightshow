name: lightshow
x-app: &app
  build: { context: ., target: base }
  restart: unless-stopped
  volumes:
    - ./.secrets/trust:/run/trust:ro
  networks: [lightshow]
services:
  mongo:
    image: mongo:8.0.34
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    entrypoint: ['bash', '/bootstrap/start.sh']
    volumes:
      - mongo-data:/data/db
      - ./.secrets/mongo-key:/bootstrap/mongo-key:ro
      - ./infra/mongo/start.sh:/bootstrap/start.sh:ro
    networks: [lightshow]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'quit(db.runCommand({ping:1}).ok ? 0 : 1)']
      interval: 5s
      timeout: 5s
      retries: 30
  mongo-init:
    image: mongo:8.0.34
    restart: on-failure
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_API_PASSWORD: ${MONGO_API_PASSWORD}
      MONGO_ENGINE_PASSWORD: ${MONGO_ENGINE_PASSWORD}
    entrypoint: ['bash', '/bootstrap/init.sh']
    volumes: ['./infra/mongo/init.sh:/bootstrap/init.sh:ro']
    networks: [lightshow]
    depends_on:
      mongo: { condition: service_healthy }
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    ports: ['8883:8883']
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./.secrets/mqtt/server.crt:/mosquitto/certs/server.crt:ro
      - ./.secrets/mqtt/server.key:/mosquitto/certs/server.key:ro
      - ./.secrets/broker:/mosquitto/data
    networks: [lightshow]
    healthcheck:
      test: [CMD-SHELL, 'nc -z 127.0.0.1 8883']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    <<: *app
    environment:
      MONGO_URL: ${MONGO_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_HOURS: ${SESSION_HOURS:-24}
      API_PORT: ${API_PORT:-3000}
      DDP_PORT: ${DDP_PORT:-4048}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MQTT_URL: ${MQTT_URL}
      MQTT_PUBLIC_URL: ${MQTT_PUBLIC_URL}
      MQTT_CA_FILE: /run/trust/mqtt-ca.crt
      HTTPS_CA_FILE: /run/trust/https-ca.crt
      MQTT_API_USER: ${MQTT_API_USER}
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD}
    command: [node, --import, tsx, apps/api/src/main.ts]
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      mosquitto: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:'+process.env.API_PORT+'/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
  show-engine:
    <<: *app
    environment:
      MONGO_URL: ${MONGO_ENGINE_URL}
      MQTT_URL: ${MQTT_URL}
      MQTT_CA_FILE: /run/trust/mqtt-ca.crt
      MQTT_ENGINE_USER: ${MQTT_ENGINE_USER}
      MQTT_ENGINE_PASSWORD: ${MQTT_ENGINE_PASSWORD}
      TARGET_FPS: ${TARGET_FPS:-40}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: [node, --import, tsx, apps/show-engine/src/main.ts]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  ui:
    build: { context: ., target: ui }
    restart: unless-stopped
    networks: [lightshow]
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      LIGHTSHOW_HOST: ${LIGHTSHOW_HOST:-lightshow.home.arpa}
      CADDY_TLS: ${CADDY_TLS:-internal}
      API_UPSTREAM: ${API_HOST:-api}:${API_PORT:-3000}
    ports: ['${HTTPS_PORT:-443}:443', '${HTTP_PORT:-80}:80']
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      lightshow:
        aliases: ['${LIGHTSHOW_HOST:-lightshow.home.arpa}']
    depends_on:
      api: { condition: service_healthy }
      ui: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 3s
      retries: 10
  esp-simulator:
    <<: *app
    profiles: [simulator]
    environment:
      SIM_MQTT_URL: mqtts://mosquitto:8883
      SIM_API_URL: ${SIM_API_URL}
      SIM_HARDWARE_ID: ${SIM_HARDWARE_ID}
      SIM_PROVISIONING_TOKEN: ${SIM_PROVISIONING_TOKEN}
      SIM_STATE_FILE: /state/identity.json
      SIM_INSPECT_PORT: 4090
      MQTT_CA_FILE: /run/trust/mqtt-ca.crt
      HTTPS_CA_FILE: /run/trust/https-ca.crt
    command: [node, --import, tsx, apps/esp-simulator/src/main.ts]
    volumes:
      - ./.secrets/trust:/run/trust:ro
      - simulator-state:/state
    ports: ['127.0.0.1:${SIM_INSPECT_PORT:-4090}:4090']
    depends_on:
      caddy: { condition: service_healthy }
networks:
  lightshow:
volumes:
  mongo-data:
  caddy-data:
  caddy-config:
  simulator-state:
